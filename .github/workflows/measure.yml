name: Measure Docker Hub lag

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: go build -o docker-lag .

      - run: ./docker-lag --user=benoittgt
        env:
          PAT: ${{ secrets.DOCKERHUB_PAT }}

      - run: ./docker-lag graph

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update lag measurements'
          file_pattern: 'data/lag.csv graphs/*.svg'
